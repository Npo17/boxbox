<html lang="es"><head><meta charset="utf-8">

<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#14151b;font-family:"Arial Black","Segoe UI Black",Arial,sans-serif;color:#f2f2f5}
  body{background:radial-gradient(900px 420px at 85% -10%,#3a1416 0%,transparent 60%),#14151b;position:relative}
  .kerb{height:22px;background:repeating-linear-gradient(90deg,#ff3b30 0 44px,#fff 44px 88px)}
  .wrap{display:grid;grid-template-columns:640px 430px;gap:30px;align-items:center;padding:34px 64px 0}

  .tag{font-size:40px;font-weight:900;text-transform:uppercase;line-height:1.02}
  .card{background:#1d1f28;border:2px solid #2c2f3b;border-radius:20px;padding:22px 24px}

  .rt{background:#b26bff;border-radius:7px;padding:1px 10px;font-weight:900;font-style:italic;margin-left:8px}
  .foot{position:absolute;left:64px;right:64px;bottom:34px;display:flex;justify-content:space-between;align-items:center;font-size:26px;font-family:Arial,sans-serif;font-weight:700}
  .url{background:#ffd23f;color:#1a1300;padding:6px 20px;border-radius:999px;font-weight:900}
  .flag{display:inline-block;width:46px;height:30px;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/15px 15px;transform:skewX(-12deg);vertical-align:middle;margin-right:12px}
</style></head><body>
